name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint (swiftlint --strict)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
      - name: Install SwiftLint
        run: brew install swiftlint
      - name: Lint
        run: make lint

  test:
    name: Unit tests
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
      - name: Test
        run: make test

  coverage:
    name: Coverage (>= 95% gate)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
      - name: Coverage gate
        run: make coverage

  mutation:
    name: Mutation testing (muter)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
      - name: Install Muter
        run: brew install muter
      - name: Mutation gate
        run: make mutation

  thread-sanitize:
    name: Thread Sanitizer
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
      - name: Test (TSan)
        run: make thread-sanitize

  secret-scan:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Secret scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  dependency-scan:
    name: Dependency audit (osv-scanner)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install osv-scanner
        run: |
          curl -sSL https://github.com/google/osv-scanner/releases/latest/download/osv-scanner_linux_amd64 -o osv-scanner
          chmod +x osv-scanner
      - name: Scan dependencies
        run: ./osv-scanner scan --lockfile Package.resolved

  build:
    name: Build (release)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
      - name: Build
        run: make build
